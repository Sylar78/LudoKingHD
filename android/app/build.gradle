// La cle de signature n'est jamais dans le depot : le workflow
// `publication-play.yml` ecrit `android/key.properties` a partir des secrets
// GitHub avant de construire. En local, sans ce fichier, `flutter run` et
// `flutter build apk --debug` continuent de marcher ; seule la construction
// release signee a besoin de la cle.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader -> keyProperties.load(reader) }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ludokinghd.ludo_king_hd"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                keyAlias = keyProperties['keyAlias']
                keyPassword = keyProperties['keyPassword']
                storeFile = file(keyProperties['storeFile'])
                storePassword = keyProperties['storePassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Identifiant vu par Google Play. Il ne pourra plus changer une fois
        // l'app publiee, et il est volontairement aligne sur celui d'iOS.
        // `namespace` ci-dessus reste l'ancien : c'est le paquet Kotlin du
        // code, sans rapport avec les stores.
        applicationId = "com.ludokinghd.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Sans `key.properties`, on retombe sur la cle de debogage pour que
            // `flutter run --release` marche en local. Google Play refuse un
            // bundle signe ainsi, mais le workflow, lui, ecrit toujours le
            // fichier : la confusion ne peut pas passer en production.
            signingConfig = keyPropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
